<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <title>Acoustic pipeline v2 encoder candidate architectures</title>
  <desc>Layer and stage shapes for AST, BEATs, OPERA CT, HeAR and PANNs Cnn14 with temporal capability gates.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#29435C"/></marker>
    <style>
      .bg{fill:#F6F8FB}.title{font:700 34px Arial,"PingFang SC",sans-serif;fill:#142B45}.sub{font:18px Arial,"PingFang SC",sans-serif;fill:#4B6177}.name{font:700 23px Arial,"PingFang SC",sans-serif;fill:#142B45}.h{font:700 16px Arial,"PingFang SC",sans-serif;fill:#1E3A5F}.t{font:14px Arial,"PingFang SC",sans-serif;fill:#263B50}.small{font:12px Arial,"PingFang SC",sans-serif;fill:#425A70}.row{fill:#fff;stroke:#1E3A5F;stroke-width:2}.stage{fill:#F2F6FA;stroke:#8FA2B5;stroke-width:1.5}.candidate{fill:#F4F7FF;stroke:#2F6FED;stroke-width:2;stroke-dasharray:8 6}.hold{fill:#FFF5ED;stroke:#C2410C;stroke-width:2;stroke-dasharray:7 6}.ok{fill:#E8F6F0;stroke:#2A7F62;stroke-width:2}.paper{fill:#F7F2FF;stroke:#7C3AED;stroke-width:2;stroke-dasharray:8 6}.arrow{fill:none;stroke:#29435C;stroke-width:2.2;marker-end:url(#a)}.tag{font:700 12px Arial,"PingFang SC",sans-serif}.blue{fill:#2F6FED}.green{fill:#2A7F62}.orange{fill:#C2410C}.purple{fill:#7C3AED}
    </style>
  </defs>
  <rect class="bg" width="2400" height="1400"/>
  <text x="50" y="58" class="title">Encoder Candidate Slot — Layer / Stage Shapes</text>
  <text x="50" y="91" class="sub">One alternative is selected per controlled comparison. “Temporal-capable” requires tokens, mask, and source-time map—not tokens alone.</text>

  <!-- AST -->
  <rect x="50" y="125" width="2300" height="220" rx="18" class="row"/>
  <text x="75" y="164" class="name">W09 · AST base384</text><text x="75" y="190" class="tag green">R0 EXECUTABLE · POOLED</text>
  <rect x="310" y="150" width="270" height="150" rx="12" class="stage"/><text x="330" y="180" class="h">R0 frontend</text><text x="330" y="207" class="t"><tspan x="330">[B,1,798,128]</tspan><tspan x="330" dy="21">transpose → [B,1,128,798]</tspan><tspan x="330" dy="21">fixed 8 s · no mask</tspan></text>
  <rect x="625" y="150" width="300" height="150" rx="12" class="stage"/><text x="645" y="180" class="h">Patch embed</text><text x="645" y="207" class="t"><tspan x="645">Conv2d 16×16 / stride10×10</tspan><tspan x="645" dy="21">grid 12×79 = 948</tspan><tspan x="645" dy="21">[B,948,768]</tspan></text>
  <rect x="970" y="150" width="310" height="150" rx="12" class="stage"/><text x="990" y="180" class="h">Positions + specials</text><text x="990" y="207" class="t"><tspan x="990">source 12×101 → center crop time79</tspan><tspan x="990" dy="21">+ CLS + DIST</tspan><tspan x="990" dy="21">[B,950,768]</tspan></text>
  <rect x="1325" y="150" width="330" height="150" rx="12" class="stage"/><text x="1345" y="180" class="h">Transformer ×12</text><text x="1345" y="207" class="t"><tspan x="1345">D768 · 12 heads</tspan><tspan x="1345" dy="21">MLP 768→3072→768</tspan><tspan x="1345" dy="21">sequence remains 950</tspan></text>
  <rect x="1700" y="150" width="270" height="150" rx="12" class="ok"/><text x="1720" y="180" class="h">Public output</text><text x="1720" y="207" class="t"><tspan x="1720">LN; (CLS+DIST)/2</tspan><tspan x="1720" dy="21">pooled [B,768]</tspan><tspan x="1720" dy="21">native flat heads legal</tspan></text>
  <rect x="2015" y="150" width="300" height="150" rx="12" class="hold"/><text x="2035" y="180" class="h">HF temporal gate</text><text x="2035" y="207" class="t"><tspan x="2035">tokens not returned</tspan><tspan x="2035" dy="21">no token_mask · no time_map</tspan><tspan x="2035" dy="21">generic HF path blocked</tspan></text>
  <path class="arrow" d="M580 225 H625"/><path class="arrow" d="M925 225 H970"/><path class="arrow" d="M1280 225 H1325"/><path class="arrow" d="M1655 225 H1700"/><path class="arrow" d="M1970 225 H2015"/>

  <!-- BEATs -->
  <rect x="50" y="365" width="2300" height="220" rx="18" class="row"/>
  <text x="75" y="404" class="name">W10 · BEATs iter3+</text><text x="75" y="430" class="tag blue">AS2M · CANDIDATE</text>
  <rect x="310" y="390" width="270" height="150" rx="12" class="stage"/><text x="330" y="420" class="h">Waveform / fbank</text><text x="330" y="447" class="t"><tspan x="330">[B,T] @16 kHz + pad mask</tspan><tspan x="330" dy="21">128-bin · 25 ms / 10 ms</tspan><tspan x="330" dy="21">[B,tau,128]</tspan></text>
  <rect x="625" y="390" width="300" height="150" rx="12" class="hold"/><text x="645" y="420" class="h">Patch Conv2d</text><text x="645" y="447" class="t"><tspan x="645">kernel=stride=p (checkpoint cfg)</tspan><tspan x="645" dy="21">[B,L0,E] → optional E→768</tspan><tspan x="645" dy="21">p not persisted decoded: TBD</tspan></text>
  <rect x="970" y="390" width="310" height="150" rx="12" class="stage"/><text x="990" y="420" class="h">Position encoder</text><text x="990" y="447" class="t"><tspan x="990">grouped Conv1d kernel128</tspan><tspan x="990" dy="21">groups16 · width768</tspan><tspan x="990" dy="21">downsampled padding mask</tspan></text>
  <rect x="1325" y="390" width="330" height="150" rx="12" class="stage"/><text x="1345" y="420" class="h">Transformer ×12</text><text x="1345" y="447" class="t"><tspan x="1345">D768 · 12 heads</tspan><tspan x="1345" dy="21">FFN 768→3072→768</tspan><tspan x="1345" dy="21">tokens [B,L,768] + mask</tspan></text>
  <rect x="1700" y="390" width="270" height="150" rx="12" class="ok"/><text x="1720" y="420" class="h">Pooled tasks</text><text x="1720" y="447" class="t"><tspan x="1720">masked/mean pool</tspan><tspan x="1720" dy="21">[B,768]</tspan><tspan x="1720" dy="21">flat/record heads legal</tspan></text>
  <rect x="2015" y="390" width="300" height="150" rx="12" class="hold"/><text x="2035" y="420" class="h">HF temporal gate</text><text x="2035" y="447" class="t"><tspan x="2035">tokens + mask exist</tspan><tspan x="2035" dy="21">source-time map absent</tspan><tspan x="2035" dy="21">build/verify time_map first</tspan></text>
  <path class="arrow" d="M580 465 H625"/><path class="arrow" d="M925 465 H970"/><path class="arrow" d="M1280 465 H1325"/><path class="arrow" d="M1655 465 H1700"/><path class="arrow" d="M1970 465 H2015"/>

  <!-- OPERA -->
  <rect x="50" y="605" width="2300" height="245" rx="18" class="row"/>
  <text x="75" y="644" class="name">W12 · OPERA-CT</text><text x="75" y="670" class="tag purple">RESPIRATORY FOUNDATION</text>
  <rect x="310" y="630" width="270" height="165" rx="12" class="stage"/><text x="330" y="660" class="h">Official frontend</text><text x="330" y="687" class="t"><tspan x="330">windowed respiratory audio</tspan><tspan x="330" dy="21">internal model grid</tspan><tspan x="330" dy="21">[B,1,256,256]</tspan><tspan x="330" dy="21">example input_sec=8</tspan></text>
  <rect x="625" y="630" width="280" height="165" rx="12" class="stage"/><text x="645" y="660" class="h">Patch embed</text><text x="645" y="687" class="t"><tspan x="645">patch4 / stride4</tspan><tspan x="645" dy="21">[B,64×64,96]</tspan><tspan x="645" dy="21">window attention size8</tspan></text>
  <rect x="950" y="630" width="340" height="165" rx="12" class="stage"/><text x="970" y="660" class="h">Swin stages</text><text x="970" y="687" class="t"><tspan x="970">×2 D96 h4 → merge 32×32 D192</tspan><tspan x="970" dy="21">×2 D192 h8 → merge 16×16 D384</tspan><tspan x="970" dy="21">×6 D384 h16 → merge 8×8 D768</tspan><tspan x="970" dy="21">×2 D768 h32 · MLP ratio4</tspan></text>
  <rect x="1335" y="630" width="315" height="165" rx="12" class="ok"/><text x="1355" y="660" class="h">Feature output</text><text x="1355" y="687" class="t"><tspan x="1355">LN / OPERA Cola wrapper</tspan><tspan x="1355" dy="21">official OPERA-CT example</tspan><tspan x="1355" dy="21">pooled [B,768]</tspan><tspan x="1355" dy="21">no local adapter receipt</tspan></text>
  <rect x="1695" y="630" width="300" height="165" rx="12" class="hold"/><text x="1715" y="660" class="h">Interface gate</text><text x="1715" y="687" class="t"><tspan x="1715">internal frame outputs ≠ v2 contract</tspan><tspan x="1715" dy="21">no exported token mask</tspan><tspan x="1715" dy="21">no source-time map</tspan><tspan x="1715" dy="21">pooled-only in v2</tspan></text>
  <rect x="2040" y="630" width="275" height="165" rx="12" class="paper"/><text x="2060" y="660" class="h">Evidence boundary</text><text x="2060" y="687" class="t"><tspan x="2060">external checkpoint/code</tspan><tspan x="2060" dy="21">overlap/provenance audit</tspan><tspan x="2060" dy="21">not current-four result</tspan></text>
  <path class="arrow" d="M580 712 H625"/><path class="arrow" d="M905 712 H950"/><path class="arrow" d="M1290 712 H1335"/><path class="arrow" d="M1650 712 H1695"/><path class="arrow" d="M1995 712 H2040"/>

  <!-- HeAR -->
  <rect x="50" y="870" width="2300" height="205" rx="18" class="row"/>
  <text x="75" y="909" class="name">W13 · HeAR 1.0.0</text><text x="75" y="935" class="tag blue">INPUT-CONTRACT GATE</text>
  <rect x="310" y="895" width="310" height="135" rx="12" class="stage"/><text x="330" y="925" class="h">Serving input</text><text x="330" y="952" class="t"><tspan x="330">2 s mono @16 kHz</tspan><tspan x="330" dy="21">waveform [B,32000]</tspan><tspan x="330" dy="21">no variable mask in public example</tspan></text>
  <rect x="670" y="895" width="380" height="135" rx="12" class="paper"/><text x="690" y="925" class="h">Health acoustic encoder</text><text x="690" y="952" class="t"><tspan x="690">masked autoencoder based on ViT-L</tspan><tspan x="690" dy="21">exact layer/patch config not exposed by</tspan><tspan x="690" dy="21">accepted serving contract → symbolic/HOLD</tspan></text>
  <rect x="1100" y="895" width="300" height="135" rx="12" class="ok"/><text x="1120" y="925" class="h">Output</text><text x="1120" y="952" class="t"><tspan x="1120">embedding [B,512]</tspan><tspan x="1120" dy="21">pooled only</tspan><tspan x="1120" dy="21">native heads need projection</tspan></text>
  <rect x="1450" y="895" width="360" height="135" rx="12" class="hold"/><text x="1470" y="925" class="h">Long-unit aggregation gate</text><text x="1470" y="952" class="t"><tspan x="1470">cycle/event/15-s/recording → 2-s windows</tspan><tspan x="1470" dy="21">needs overlap, pooling and lineage receipt</tspan><tspan x="1470" dy="21">no generic temporal output</tspan></text>
  <rect x="1860" y="895" width="455" height="135" rx="12" class="paper"/><text x="1880" y="925" class="h">Evidence boundary</text><text x="1880" y="952" class="t"><tspan x="1880">official gated model + model card</tspan><tspan x="1880" dy="21">health-pretraining claim ≠ current-four result</tspan><tspan x="1880" dy="21">no zero-shot assertion</tspan></text>
  <path class="arrow" d="M620 962 H670"/><path class="arrow" d="M1050 962 H1100"/><path class="arrow" d="M1400 962 H1450"/><path class="arrow" d="M1810 962 H1860"/>

  <!-- PANNs -->
  <rect x="50" y="1095" width="2300" height="245" rx="18" class="row"/>
  <text x="75" y="1134" class="name">W11 · PANNs Cnn14</text><text x="75" y="1160" class="tag blue">GENERAL-AUDIO CONTROL</text>
  <rect x="310" y="1120" width="270" height="165" rx="12" class="stage"/><text x="330" y="1150" class="h">Frontend</text><text x="330" y="1177" class="t"><tspan x="330">waveform → STFT/log-mel64</tspan><tspan x="330" dy="21">[B,1,tau,64]</tspan><tspan x="330" dy="21">BN + SpecAugment(train)</tspan></text>
  <rect x="625" y="1120" width="400" height="165" rx="12" class="stage"/><text x="645" y="1150" class="h">Six ConvBlocks</text><text x="645" y="1177" class="t"><tspan x="645">each block: 2×Conv3×3 + BN/ReLU</tspan><tspan x="645" dy="21">channels 64→128→256→512→1024→2048</tspan><tspan x="645" dy="21">pool2×2 for first five; final pool1×1</tspan><tspan x="645" dy="21">time ≈ floor(tau/32), freq 2</tspan></text>
  <rect x="1070" y="1120" width="340" height="165" rx="12" class="stage"/><text x="1090" y="1150" class="h">Global pooling</text><text x="1090" y="1177" class="t"><tspan x="1090">mean over frequency</tspan><tspan x="1090" dy="21">time max + time mean</tspan><tspan x="1090" dy="21">Linear 2048→2048</tspan><tspan x="1090" dy="21">embedding [B,2048]</tspan></text>
  <rect x="1455" y="1120" width="320" height="165" rx="12" class="ok"/><text x="1475" y="1150" class="h">Native-head use</text><text x="1475" y="1177" class="t"><tspan x="1475">project 2048→D*</tspan><tspan x="1475" dy="21">flat/recording heads shape-legal</tspan><tspan x="1475" dy="21">protocol/local adapter pending</tspan></text>
  <rect x="1820" y="1120" width="495" height="165" rx="12" class="hold"/><text x="1840" y="1150" class="h">Temporal / evidence gate</text><text x="1840" y="1177" class="t"><tspan x="1840">Cnn14 public output discards time structure</tspan><tspan x="1840" dy="21">no token_mask · no time_map</tspan><tspan x="1840" dy="21">AudioSet performance is not respiratory performance</tspan><tspan x="1840" dy="21">generic HF temporal path blocked</tspan></text>
  <path class="arrow" d="M580 1202 H625"/><path class="arrow" d="M1025 1202 H1070"/><path class="arrow" d="M1410 1202 H1455"/><path class="arrow" d="M1775 1202 H1820"/>

  <text x="50" y="1375" class="small">Full numerical/source audit: docs/pipeline/pipeline_candidate_layer_shapes_v2.md. Missing checkpoint/model-card internals remain symbolic rather than inferred.</text>
</svg>
